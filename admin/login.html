<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BASICS Admin Portal</title>
  <style>
    body {
      background: #eaf5ff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h2 { color: #111; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .input-group {
      position: relative;
      margin-bottom: 15px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 14px;
      color: #666;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0091ff;
      color: white;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    button:hover {
      background: #0077d6;
    }
    #error-msg {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    
    /* لوحة تحكم الأدمن بعد تسجيل الدخول */
    #adminDashboard {
      display: none;
      width: 90%;
      max-width: 900px;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: left;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .btn-logout {
      background: #ff4757;
      width: auto;
      padding: 8px 20px;
    }
  </style>
</head>
<body>

  <!-- نموذج تسجيل الدخول -->
  <div class="card" id="loginCard">
    <h2>BASICS ADMIN</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-group">
        <input type="email" id="email" placeholder="Email" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required>
        <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
      </div>
      <button type="submit" id="submitBtn">LOG IN</button>
      <div id="error-msg"></div>
    </form>
  </div>

  <!-- لوحة تحكم الأدمن الرئيسي بعد الدخول -->
  <div id="adminDashboard">
    <div class="dashboard-header">
      <h2>مرحباً بك في لوحة تحكم المتجر (BASICS)</h2>
      <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>
    <p>أهلاً بك، <strong id="adminEmail"></strong>!</p>
    <hr>
    <h3>إدارة المتجر:</h3>
    <ul>
      <li>عرض وإضافة المنتجات الجديدة</li>
      <li>متابعة طلبات الشراء والعملاء</li>
      <li>إدارة المخزون والتصنيفات</li>
    </ul>
  </div>

  <script>
    // إظهار/إخفاء كلمة المرور
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    // معالجة تسجيل الدخول دون الحاجة لملف login.js خارجي مفقود
    async function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const submitBtn = document.getElementById('submitBtn');

      errorMsg.style.display = 'none';
      submitBtn.innerText = 'Logging in...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // حفظ بيانات الجلسة والتأكد من الصلاحية
          if (data.user && data.user.role === 'admin') {
            localStorage.setItem('adminToken', data.token || 'logged_in');
            localStorage.setItem('adminEmail', data.user.email);
            showDashboard(data.user.email);
          } else if (data.role === 'admin') {
            localStorage.setItem('adminToken', data.token || 'logged_in');
            localStorage.setItem('adminEmail', email);
            showDashboard(email);
          } else {
            throw new Error('هذا الحساب لا يمتلك صلاحيات الأدمن');
          }
        } else {
          throw new Error(data.message || 'بيانات الدخول غير صحيحة');
        }
      } catch (err) {
        errorMsg.innerText = err.message;
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.innerText = 'LOG IN';
        submitBtn.disabled = false;
      }
    }

    function showDashboard(email) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'block';
      document.getElementById('adminEmail').innerText = email;
    }

    function logout() {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminEmail');
      location.reload();
    }

    // الفحص التلقائي للحالة عند فتح الصفحة
    window.onload = function() {
      const savedEmail = localStorage.getItem('adminEmail');
      const savedToken = localStorage.getItem('adminToken');
      if (savedToken && savedEmail) {
        showDashboard(savedEmail);
      }
    };
  </script>
</body>
</html>
