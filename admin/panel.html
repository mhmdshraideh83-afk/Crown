<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BASICS Admin Dashboard</title>
  <style>
    body {
      background: #eaf5ff;
      font-family: system-ui, sans-serif;
      margin: 0; padding: 20px;
      color: #111;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 20px;
      background: #ffffff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active {
      background: #0091ff;
      color: white;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }
    .btn {
      background: #0091ff;
      color: white;
      padding: 8px 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>لوحة تحكم BASICS</h2>
    <button class="btn" onclick="logout()">تسجيل الخروج</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('products')">المنتجات</button>
    <button class="tab-btn" onclick="switchTab('orders')">الطلبات</button>
    <button class="tab-btn" onclick="switchTab('settings')">إعدادات الدفع والأرباح</button>
  </div>

  <div id="productsView" class="card">
    <button class="btn" onclick="openProductForm()" style="margin-bottom: 15px;">+ منتج جديد</button>
    <table>
      <thead>
        <tr>
          <th>الصورة</th>
          <th>الاسم</th>
          <th>سعر البيع</th>
          <th>التكلفة</th>
          <th>الربح</th>
          <th>العمليات</th>
        </tr>
      </thead>
      <tbody id="productsTable"></tbody>
    </table>
  </div>

  <div id="ordersView" class="card" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>رقم الطلب</th>
          <th>العميل</th>
          <th>الإجمالي</th>
          <th>حالة الدفع</th>
          <th>التاريخ</th>
        </tr>
      </thead>
      <tbody id="ordersTable"></tbody>
    </table>
  </div>

  <div id="settingsView" class="card" style="display:none;">
    <h3>إعدادات المزود والمدفوعات</h3>
    <p>بوابة الدفع: Stripe / Tap</p>
    <p>الحساب المرتبط: Connected (****1234)</p>
  </div>

  <script src="panel.js"></script>
</body>
</html>
