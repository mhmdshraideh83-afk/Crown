<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BASICS — Premium Minimal Fashion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <button class="icon-btn">☰</button>
    <div class="brand">BASICS</div>
    <button class="icon-btn" onclick="toggleCart()">Cart (<span id="cartCount">0</span>)</button>
  </header>

  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>NEW BASICS</h1>
      <p>ESSENTIAL FASHION FOR EVERYDAY WEAR</p>
      <a href="#collection" class="btn-primary">SHOP NOW</a>
    </div>
  </section>

  <main class="container" id="collection">
    <h2 class="section-title">COLLECTION</h2>
    
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search products..." oninput="handleSearch()">
      <select id="categorySelect" onchange="handleFilter()">
        <option value="All">All Categories</option>
        <option value="Tops">Tops</option>
        <option value="Bottoms">Bottoms</option>
        <option value="Hoodies">Hoodies</option>
      </select>
      <select id="sortSelect" onchange="handleFilter()">
        <option value="default">Default Sort</option>
        <option value="price_low">Price: Low to High</option>
        <option value="price_high">Price: High to Low</option>
      </select>
    </div>

    <div id="productGrid" class="product-grid"></div>
  </main>

  <!-- Cart Drawer -->
  <div id="drawerOverlay" class="drawer-overlay" onclick="toggleCart()"></div>
  <div id="cartDrawer" class="cart-drawer">
    <div class="drawer-header">
      <h3>YOUR CART</h3>
      <button class="icon-btn" onclick="toggleCart()">✕</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="drawer-footer">
      <div class="total-row">
        <span>المجموع الكلي:</span>
        <span id="cart-total">€0.00</span>
      </div>
      <button class="btn-checkout" onclick="openCheckout()">المتابعة لإتمام الطلب</button>
    </div>
  </div>

  <!-- Product Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeProductModal()">✕</span>
      <div class="product-detail-view" id="modalProductDetail"></div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCheckoutModal()">✕</span>
      <h3>CHECKOUT</h3>
      <form id="checkoutForm" onsubmit="processCheckout(event)">
        <input type="text" id="custName" placeholder="Full Name" required>
        <input type="email" id="custEmail" placeholder="Email" required>
        <input type="text" id="custPhone" placeholder="Phone Number" required>
        <input type="text" id="custAddress" placeholder="Street Address" required>
        <input type="text" id="custCity" placeholder="City" required>
        <input type="text" id="custZip" placeholder="Postal Code" required>
        <input type="text" id="custCountry" placeholder="Country Code (e.g. FR, DE)" maxLength="2" required>
        <button type="submit" class="btn-checkout" style="margin-top:15px;">PROCEED TO PAYMENT</button>
      </form>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
